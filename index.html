<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis Assistant</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080d18;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 700px;
      background: #121a2b;
      padding: 30px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 0 40px #000;
    }

    .robot {
      font-size: 70px;
    }

    h1 {
      font-size: 35px;
      margin: 10px;
    }

    #status {
      color: #20df82;
      margin: 15px;
    }

    #chat {
      height: 300px;
      overflow-y: auto;
      background: #080d18;
      border-radius: 15px;
      padding: 15px;
      text-align: left;
    }

    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
    }

    .jarvis {
      background: #202d48;
    }

    .user {
      background: #315efb;
      text-align: right;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 15px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    button {
      padding: 15px 20px;
      border: none;
      border-radius: 12px;
      background: #315efb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #start {
      background: #16b96c;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="robot">🤖</div>

  <h1>JARVIS</h1>

  <div id="status">
    Say "Hey Jarvis"
  </div>

  <div id="chat">

    <div class="message jarvis">
      Hello! I am Jarvis. Say "Hey Jarvis" followed by a command.
    </div>

  </div>

  <div class="controls">

    <input
      id="input"
      placeholder="Type a command..."
    >

    <button onclick="sendText()">
      Send
    </button>

  </div>

  <button id="start" onclick="startJarvis()">
    🎤 Start Jarvis
  </button>

</div>


<script>

let recognition;
let jarvisRunning = false;


/* SPEAK */

function speak(text) {

  const voice =
    new SpeechSynthesisUtterance(text);

  voice.rate = 1;
  voice.pitch = 1;

  speechSynthesis.cancel();

  speechSynthesis.speak(voice);
}


/* CHAT MESSAGE */

function addMessage(text, type) {

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  message.innerText = text;

  document
    .getElementById("chat")
    .appendChild(message);

  document
    .getElementById("chat")
    .scrollTop = 999999;

}


/* COMMAND */

function command(text) {

  const lower =
    text.toLowerCase();


  /* YOUTUBE */

  if (
    lower.includes("open youtube")
  ) {

    speak("Opening YouTube.");

    window.open(
      "https://www.youtube.com",
      "_blank"
    );

    return;
  }


  /* PLAY SONG */

  if (
    lower.includes("play")
  ) {

    let song =
      text
      .replace(/play/ig, "")
      .trim();

    if (song === "") {

      speak(
        "What song should I play?"
      );

      return;
    }

    speak(
      "Searching YouTube for " + song
    );

    window.open(
      "https://www.youtube.com/results?search_query=" +
      encodeURIComponent(song),
      "_blank"
    );

    return;
  }


  /* YOUTUBE SEARCH */

  if (
    lower.includes("search youtube")
  ) {

    let search =
      text
      .replace(/search youtube/ig, "")
      .trim();

    speak(
      "Searching YouTube for " + search
    );

    window.open(
      "https://www.youtube.com/results?search_query=" +
      encodeURIComponent(search),
      "_blank"
    );

    return;
  }


  /* GOOGLE SEARCH */

  if (
    lower.includes("search google")
  ) {

    let search =
      text
      .replace(/search google/ig, "")
      .trim();

    speak(
      "Searching Google for " + search
    );

    window.open(
      "https://www.google.com/search?q=" +
      encodeURIComponent(search),
      "_blank"
    );

    return;
  }


  /* GOOGLE */

  if (
    lower === "open google"
  ) {

    speak("Opening Google.");

    window.open(
      "https://www.google.com",
      "_blank"
    );

    return;
  }


  /* TIME */

  if (
    lower.includes("what time") ||
    lower === "time"
  ) {

    speak(
      "The time is " +
      new Date().toLocaleTimeString()
    );

    return;
  }


  /* DATE */

  if (
    lower.includes("what date") ||
    lower.includes("today")
  ) {

    speak(
      "Today is " +
      new Date().toLocaleDateString()
    );

    return;
  }


  /* GMAIL */

  if (
    lower.includes("open gmail")
  ) {

    speak("Opening Gmail.");

    window.open(
      "https://mail.google.com",
      "_blank"
    );

    return;
  }


  /* ROBLOX */

  if (
    lower.includes("open roblox")
  ) {

    speak("Opening Roblox.");

    window.open(
      "https://www.roblox.com",
      "_blank"
    );

    return;
  }


  /* HELLO */

  if (
    lower.includes("hello") ||
    lower.includes("hi")
  ) {

    speak(
      "Hello! How can I help you?"
    );

    return;
  }


  speak(
    "Sorry, I don't know that command yet."
  );

}


/* SEND TEXT */

function sendText() {

  const input =
    document.getElementById("input");

  const text =
    input.value.trim();

  if (!text) return;

  addMessage(
    text,
    "user"
  );

  input.value = "";

  command(text);

}


/* VOICE */

function startJarvis() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    alert(
      "Voice recognition is not supported in this browser."
    );

    return;
  }


  recognition =
    new SpeechRecognition();

  recognition.lang =
    "en-US";

  recognition.continuous =
    true;

  recognition.interimResults =
    false;


  jarvisRunning = true;


  document.getElementById("status")
    .innerText =
    '🎤 Listening... Say "Hey Jarvis"';


  recognition.onresult =
    function(event) {

      const result =
        event.results[
          event.results.length - 1
        ];

      const spoken =
        result[0].transcript.trim();


      const lower =
        spoken.toLowerCase();


      if (
        lower.includes("hey jarvis")
      ) {

        let commandText =
          spoken
          .replace(/hey jarvis/ig, "")
          .trim();


        if (commandText) {

          addMessage(
            commandText,
            "user"
          );

          command(
            commandText
          );

        } else {

          speak(
            "Yes, I'm listening."
          );

        }

      }

    };


  recognition.onend =
    function() {

      if (jarvisRunning) {

        try {

          recognition.start();

        } catch(error) {}

      }

    };


  recognition.onerror =
    function(error) {

      console.log(
        "Jarvis error:",
        error
      );

    };


  try {

    recognition.start();

  } catch(error) {}

}

</script>

</body>
</html>
