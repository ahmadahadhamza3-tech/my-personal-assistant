<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>
  <meta name="description" content="A voice-controlled personal assistant web app powered by Web Speech API.">
  <meta property="og:title" content="JARVIS">
  <meta property="og:description" content="A voice-controlled personal assistant web app powered by Web Speech API.">
  <style>
    body {
      margin: 0;
      background: #050505;
      color: #00eaff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 80px;
    }

    h1 {
      font-size: 60px;
      margin-bottom: 10px;
    }

    p {
      font-size: 20px;
      color: white;
    }

    button {
      margin-top: 30px;
      padding: 18px 35px;
      font-size: 22px;
      border: 2px solid #00eaff;
      border-radius: 15px;
      background: #00151a;
      color: #00eaff;
      cursor: pointer;
    }

    button:hover {
      background: #00343d;
    }

    #status {
      margin-top: 30px;
      font-size: 20px;
      color: white;
    }
  </style>
</head>

<body>

  <h1>JARVIS</h1>
  <p>Say "Hey Jarvis"</p>

  <button id="start-jarvis-btn" onclick="toggleJarvis()">🎤 Start Jarvis</button>

  <div id="status">Jarvis is sleeping...</div>
  <div id="hint" style="margin-top: 15px; font-size: 14px; color: #888;">
    Microphone permission required. If blocked in preview, open in a new tab.
  </div>

  <div style="margin-top: 40px; display: inline-block; text-align: center;">
    <p style="font-size: 15px; color: #00eaff; margin-bottom: 10px;">Quick Test (click to test voice response):</p>
    <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
      <button style="margin-top: 0; padding: 8px 16px; font-size: 14px; border-radius: 8px;" onclick="simulateVoice('what time')">⏰ What time</button>
      <button style="margin-top: 0; padding: 8px 16px; font-size: 14px; border-radius: 8px;" onclick="simulateVoice('open youtube')">▶️ Open YouTube</button>
      <button style="margin-top: 0; padding: 8px 16px; font-size: 14px; border-radius: 8px;" onclick="simulateVoice('open google')">🔍 Open Google</button>
    </div>
  </div>

  <script>
    const status = document.getElementById("status");
    const startBtn = document.getElementById("start-jarvis-btn");
    let wakeRecognition = null;
    let isJarvisRunning = false;
    let isCommandMode = false;
    let restartTimer = null;

    function updateButton() {
      if (isJarvisRunning) {
        startBtn.innerText = "⏹️ Stop Jarvis";
        startBtn.style.background = "#00343d";
        startBtn.style.borderColor = "#ff4d4d";
        startBtn.style.color = "#ff8080";
      } else {
        startBtn.innerText = "🎤 Start Jarvis";
        startBtn.style.background = "#00151a";
        startBtn.style.borderColor = "#00eaff";
        startBtn.style.color = "#00eaff";
      }
    }

    function toggleJarvis() {
      if (isJarvisRunning) {
        stopJarvis();
      } else {
        startJarvis();
      }
    }

    function stopJarvis() {
      isJarvisRunning = false;
      isCommandMode = false;
      clearTimeout(restartTimer);
      if (wakeRecognition) {
        try {
          wakeRecognition.abort();
        } catch (e) {}
      }
      updateButton();
      status.innerText = "Jarvis is sleeping...";
    }

    async function startJarvis() {
      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        status.innerText =
          "❌ Speech recognition is not supported in this browser. Please use Chrome or Edge.";
        return;
      }

      isJarvisRunning = true;
      isCommandMode = false;
      updateButton();
      status.innerText = "🔄 Initializing microphone...";

      // Prompt for mic permission cleanly if available
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(track => track.stop());
        } catch (err) {
          if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
            status.innerText = "❌ Microphone permission blocked! Please allow microphone access in your browser bar.";
            isJarvisRunning = false;
            updateButton();
            return;
          }
        }
      }

      setupWakeRecognition();
    }

    function setupWakeRecognition() {
      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition || !isJarvisRunning) return;

      if (wakeRecognition) {
        try {
          wakeRecognition.abort();
        } catch (e) {}
      }

      wakeRecognition = new SpeechRecognition();
      wakeRecognition.lang = "en-US";
      wakeRecognition.continuous = true;
      wakeRecognition.interimResults = false;

      wakeRecognition.onstart = function() {
        if (isJarvisRunning && !isCommandMode) {
          status.innerText = "🎤 Listening... Say 'Hey Jarvis'";
        }
      };

      wakeRecognition.onresult = function(event) {
        const text =
          event.results[event.results.length - 1][0].transcript
          .toLowerCase();

        status.innerText = "You said: " + text;

        if (text.includes("hey jarvis")) {
          isCommandMode = true;
          speak("Yes, I am listening.");

          try {
            wakeRecognition.stop();
          } catch (e) {}

          setTimeout(() => {
            if (isJarvisRunning) {
              listenForCommand();
            }
          }, 1500);
        }
      };

      wakeRecognition.onerror = function(event) {
        console.log("Wake recognition event:", event.error);
        // no-speech or aborted are expected in continuous recognition
        if (event.error === "no-speech" || event.error === "aborted") {
          return;
        }

        if (event.error === "not-allowed") {
          status.innerText = "❌ Microphone permission blocked. Allow mic access in browser settings.";
          isJarvisRunning = false;
          updateButton();
          return;
        }

        if (event.error === "audio-capture") {
          status.innerText = "❌ Microphone not found or unavailable.";
          return;
        }

        status.innerText = "⚠️ Voice status: " + event.error;
      };

      wakeRecognition.onend = function() {
        // Auto-restart recognition if Jarvis is active and not listening for a command
        if (isJarvisRunning && !isCommandMode) {
          clearTimeout(restartTimer);
          restartTimer = setTimeout(() => {
            if (isJarvisRunning && !isCommandMode) {
              try {
                wakeRecognition.start();
              } catch (e) {
                // If start fails due to pending state, retry in a moment
                setTimeout(() => {
                  if (isJarvisRunning && !isCommandMode) {
                    try { wakeRecognition.start(); } catch (err) {}
                  }
                }, 300);
              }
            }
          }, 200);
        } else if (!isJarvisRunning) {
          status.innerText = "Jarvis is sleeping...";
        }
      };

      try {
        wakeRecognition.start();
      } catch (e) {
        console.warn("Recognition start error:", e);
      }
    }

    function listenForCommand() {
      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      const command = new SpeechRecognition();
      command.lang = "en-US";
      command.continuous = false;
      command.interimResults = false;

      status.innerText = "🎧 Listening for your command...";

      command.onresult = function(event) {
        const text = event.results[0][0].transcript.toLowerCase();
        status.innerText = "Command: " + text;
        handleCommand(text);
      };

      command.onerror = function(event) {
        console.log("Command recognition error:", event.error);
        if (event.error !== "no-speech" && event.error !== "aborted") {
          status.innerText = "❌ Error: " + event.error;
        }
      };

      command.onend = function() {
        isCommandMode = false;
        if (isJarvisRunning) {
          clearTimeout(restartTimer);
          restartTimer = setTimeout(() => {
            if (isJarvisRunning && !isCommandMode) {
              setupWakeRecognition();
            }
          }, 800);
        }
      };

      try {
        command.start();
      } catch (e) {
        isCommandMode = false;
        if (isJarvisRunning) setupWakeRecognition();
      }
    }

    function simulateVoice(cmd) {
      status.innerText = "Command (simulated): " + cmd;
      handleCommand(cmd);
    }

    function openDestination(url) {
      try {
        const opened = window.open(url, "_blank");
        if (!opened) {
          window.location.href = url;
        }
      } catch (e) {
        window.location.href = url;
      }
    }

    function handleCommand(text) {
      if (text.includes("open youtube")) {
        speak("Opening YouTube");
        openDestination("https://www.youtube.com");
      }
      else if (text.includes("open google")) {
        speak("Opening Google");
        openDestination("https://www.google.com");
      }
      else if (text.includes("open gmail")) {
        speak("Opening Gmail");
        openDestination("https://mail.google.com");
      }
      else if (text.includes("open roblox")) {
        speak("Opening Roblox");
        openDestination("https://www.roblox.com");
      }
      else if (text.includes("what time")) {
        const time = new Date().toLocaleTimeString();
        speak("The time is " + time);
      }
      else {
        speak("I heard you say " + text);
      }
    }

    function speak(text) {
      const speech = new SpeechSynthesisUtterance(text);
      speech.lang = "en-US";
      speech.rate = 1;
      speech.pitch = 0.8;
      window.speechSynthesis.speak(speech);
    }
  </script>

</body>
</html>
