<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .assistant {
      width: 95%;
      max-width: 700px;
      background: #151c32;
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .status {
      text-align: center;
      color: #8fa3c7;
      margin-bottom: 20px;
    }

    .chat {
      height: 350px;
      overflow-y: auto;
      background: #0e1426;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .message {
      padding: 12px 15px;
      border-radius: 15px;
      margin-bottom: 10px;
      max-width: 85%;
      line-height: 1.4;
    }

    .assistant-message {
      background: #202b49;
    }

    .user-message {
      background: #315efb;
      margin-left: auto;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    #send {
      background: #315efb;
      color: white;
    }

    #mic {
      background: #19b36b;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="assistant">

    <h1>🤖 My Personal Assistant</h1>

    <div class="status" id="status">
      Ready to help you
    </div>

    <div class="chat" id="chat">
      <div class="message assistant-message">
        Hello! I'm your personal assistant. What can I do for you?
      </div>
    </div>

    <div class="controls">
      <input
        id="input"
        type="text"
        placeholder="Type a command..."
      >

      <button id="mic">🎤</button>

      <button id="send">Send</button>
    </div>

  </div>

<script>

const input = document.getElementById("input");
const send = document.getElementById("send");
const mic = document.getElementById("mic");
const chat = document.getElementById("chat");
const status = document.getElementById("status");

function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}

function speak(text) {

  const speech = new SpeechSynthesisUtterance(text);

  speech.rate = 1;
  speech.pitch = 1;

  window.speechSynthesis.speak(speech);
}

function assistantReply(command) {

  const text = command.toLowerCase();

  if (text.includes("hello") || text.includes("hi")) {

    return "Hello! Nice to meet you. How can I help you?";

  }

  if (text.includes("time")) {

    return "The current time is " +
      new Date().toLocaleTimeString();

  }

  if (text.includes("date")) {

    return "Today is " +
      new Date().toLocaleDateString();

  }

  if (text.includes("youtube")) {

    window.open("https://www.youtube.com", "_blank");

    return "Opening YouTube.";

  }

  if (text.includes("google")) {

    window.open("https://www.google.com", "_blank");

    return "Opening Google.";

  }

  if (text.includes("github")) {

    window.open("https://github.com", "_blank");

    return "Opening GitHub.";

  }

  if (text.includes("gmail")) {

    window.open("https://mail.google.com", "_blank");

    return "Opening Gmail.";

  }

  if (text.includes("search")) {

    const query = command
      .replace(/search/ig, "")
      .trim();

    if (query) {

      window.open(
        "https://www.google.com/search?q=" +
        encodeURIComponent(query),
        "_blank"
      );

      return "Searching Google for " + query;

    }

    return "What would you like me to search for?";
  }

  return "I can currently open websites, search Google, tell you the time and date, and respond to simple commands. We can add a real AI brain next.";

}

function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user-message");

  input.value = "";

  const reply = assistantReply(text);

  setTimeout(() => {

    addMessage(reply, "assistant-message");

    speak(reply);

  }, 400);

}

send.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {

    sendMessage();

  }

});


// Voice recognition

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {

  const recognition = new SpeechRecognition();

  recognition.lang = "en-US";

  recognition.continuous = false;

  recognition.interimResults = false;

  mic.addEventListener("click", () => {

    status.textContent = "🎤 Listening...";

    recognition.start();

  });

  recognition.onresult = function(event) {

    const transcript =
      event.results[0][0].transcript;

    input.value = transcript;

    status.textContent = "Command received";

    sendMessage();

  };

  recognition.onerror = function() {

    status.textContent = "Voice recognition error";

  };

  recognition.onend = function() {

    status.textContent = "Ready to help you";

  };

} else {

  mic.disabled = true;

  status.textContent =
    "Voice recognition isn't supported in this browser.";

}

</script>

</body>
</html>
