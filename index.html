<!DOCTYPE html>
<html>
<head>
  <title>JARVIS</title>
  <style>
    body {
      margin: 0;
      background: #050505;
      color: #00eaff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 80px;
    }

    h1 {
      font-size: 60px;
      margin-bottom: 10px;
    }

    p {
      font-size: 20px;
      color: white;
    }

    button {
      margin-top: 30px;
      padding: 18px 35px;
      font-size: 22px;
      border: 2px solid #00eaff;
      border-radius: 15px;
      background: #00151a;
      color: #00eaff;
      cursor: pointer;
    }

    button:hover {
      background: #00343d;
    }

    #status {
      margin-top: 30px;
      font-size: 20px;
      color: white;
    }
  </style>
</head>

<body>

  <h1>JARVIS</h1>
  <p>Say "Hey Jarvis"</p>

  <button onclick="startJarvis()">🎤 Start Jarvis</button>

  <div id="status">Jarvis is sleeping...</div>

  <script>
    const status = document.getElementById("status");

    function startJarvis() {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        status.innerText =
          "❌ Speech recognition is not supported in this browser.";
        return;
      }

      const recognition = new SpeechRecognition();

      recognition.lang = "en-US";
      recognition.continuous = true;
      recognition.interimResults = false;

      status.innerText = "🎤 Listening... Say Hey Jarvis";

      recognition.onresult = function(event) {

        const text =
          event.results[event.results.length - 1][0].transcript
          .toLowerCase();

        status.innerText = "You said: " + text;

        if (text.includes("hey jarvis")) {
          speak("Yes, I am listening.");

          setTimeout(() => {
            listenForCommand();
          }, 1500);
        }
      };

      recognition.onerror = function(event) {
        status.innerText = "❌ Microphone error: " + event.error;
      };

      recognition.onend = function() {
        status.innerText = "Jarvis stopped listening.";
      };

      recognition.start();
    }

    function listenForCommand() {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      const command = new SpeechRecognition();

      command.lang = "en-US";
      command.continuous = false;
      command.interimResults = false;

      status.innerText = "🎧 Listening for your command...";

      command.onresult = function(event) {

        const text =
          event.results[0][0].transcript.toLowerCase();

        status.innerText = "Command: " + text;

        handleCommand(text);
      };

      command.onerror = function(event) {
        status.innerText = "❌ Error: " + event.error;
      };

      command.start();
    }

    function handleCommand(text) {

      if (text.includes("open youtube")) {
        speak("Opening YouTube");
        window.location.href = "https://www.youtube.com";
      }

      else if (text.includes("open google")) {
        speak("Opening Google");
        window.location.href = "https://www.google.com";
      }

      else if (text.includes("open gmail")) {
        speak("Opening Gmail");
        window.location.href = "https://mail.google.com";
      }

      else if (text.includes("open roblox")) {
        speak("Opening Roblox");
        window.location.href = "https://www.roblox.com";
      }

      else if (text.includes("what time")) {
        const time = new Date().toLocaleTimeString();
        speak("The time is " + time);
      }

      else {
        speak("I heard you say " + text);
      }
    }

    function speak(text) {

      const speech = new SpeechSynthesisUtterance(text);

      speech.lang = "en-US";
      speech.rate = 1;
      speech.pitch = 0.8;

      window.speechSynthesis.speak(speech);
    }
  </script>

</body>
</html>
